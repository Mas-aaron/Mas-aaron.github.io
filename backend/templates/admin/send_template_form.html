{% extends "admin/base_site.html" %}
{% block content %}
<h1>{{ title }}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="submit-row">
        <input type="submit" value="Send Notification" class="default" name="_send">
        <a href="{% url 'admin:api_notificationtemplate_changelist' %}" class="button">Cancel</a>
    </div>
</form>
{% endblock %}
