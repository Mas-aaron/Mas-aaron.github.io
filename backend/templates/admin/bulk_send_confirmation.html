{% extends "admin/base_site.html" %}

{% block content %}
  <h1>{{ title }}</h1>
  <p>This will send the notification "{{ template.name }}" to {{ user_count }} users with active devices.</p>
  <form method="post">
    {% csrf_token %}
    <div class="submit-row">
      <input type="submit" value="Confirm Bulk Send" class="default" name="_send">
      <a href="{% url 'admin:api_notificationtemplate_changelist' %}" class="button">Cancel</a>
    </div>
  </form>
{% endblock %}
