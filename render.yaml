databases:
  - name: fooddeliverydb
    plan: free
    databaseName: fooddelivery
    user: fooddelivery

services:
  - type: web
    plan: free
    name: food-delivery-backend
    env: python
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install poetry && poetry config virtualenvs.create false && poetry install --only=main && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py create_admin"
    startCommand: "gunicorn --workers 4 --bind 0.0.0.0:$PORT food_delivery.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fooddeliverydb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: RENDER
        value: true
      - key: GOOGLE_MAPS_API_KEY
        value: AIzaSyB2_rwYdL9Tr_LWV7PDfn83n8-2_6KVahs
      - key: GOOGLE_CLOUD_PROJECT
        value: fortexpress-5641c
