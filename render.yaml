databases:
  - name: fooddeliverydb
    plan: free
    databaseName: fooddelivery
    user: fooddelivery

services:
  - type: web
    plan: free
    name: food-delivery-backend
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn food_delivery.asgi:application -k uvicorn.workers.UvicornWorker'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fooddeliverydb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: GOOGLE_MAPS_API_KEY
        value: AIzaSyB2_rwYdL9Tr_LWV7PDfn83n8-2_6KVahs
      - key: GOOGLE_CLOUD_PROJECT
        value: fortexpress-5641c
