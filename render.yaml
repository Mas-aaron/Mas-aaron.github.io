services:
  # 1. PostgreSQL Database
  - type: postgresql  # Changed from "postgres" to "postgresql"
    name: food-delivery-db  # Give it a unique name
    plan: free
    databaseName: food_delivery
    user: food_delivery_user

  # 2. Redis Instance
  - type: redis
    name: food-delivery-redis
    plan: free

  # 3. Web Service (Django)
  - type: web
    name: food-delivery-web
    env: python
    plan: free
    region: oregon  # Specify your preferred region
    buildCommand: |
      poetry install --no-interaction --no-ansi
      poetry run python manage.py migrate
    startCommand: gunicorn food_delivery.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: food-delivery-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: food-delivery-redis
          property: connectionString
      - key: ALLOWED_HOSTS
        value: .onrender.com

  # 4. Worker (Daphne for WebSockets)
  - type: worker
    name: food-delivery-worker
    env: python
    plan: free
    buildCommand: |
      poetry install --no-interaction --no-ansi
    startCommand: daphne -b 0.0.0.0 -p $PORT food_delivery.asgi:application
    envVars:
      - key: SECRET_KEY
        fromService:
          name: food-delivery-web
          envVarKey: SECRET_KEY
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: food-delivery-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: food-delivery-redis
          property: connectionString